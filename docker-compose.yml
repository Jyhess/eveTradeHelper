version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: eve_trade_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly no --save 1 1000 --save 300 100 --save 900 10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: eve_trade_backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      redis:
        condition: service_healthy
      zipkin:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: eve_trade_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: eve_trade_zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped
    environment:
      - STORAGE_TYPE=mem

volumes:
  redis_data:

